<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>blog_index</title>

    <link rel="stylesheet" type="text/css" href="../css_styles/style.css" />

    <script src="../libraries/p5.min.js"></script>
    <script src="../libraries/p5.sound.min.js"></script>

    <style>
      body {
        margin: 0;
        display: flex;
        background: #fff;
      }

      /* 左侧导航栏 */
      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 200px;
        height: 100%;
        background-color: #f3f3f3;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        border-right: 2px solid #ccc;
        gap: 130px;
        padding: 20px;
        box-sizing: border-box;
        z-index: 1000;
      }

      /* 导航栏特殊样式 */

      #sidebar a {
        font-family: "Helvetica";
        display: block;
        margin: 8px 0;
        color: #111;
        font-size: 1em;      /* h5 的字号 */
        font-weight: bold;   /* h5 的粗体 */
        text-decoration: none;
        transition: color 0.2s ease;
      }

      /* 鼠标悬浮 */
      #sidebar a:hover {
        color: #92c262;
        text-decoration: underline;
      }

      /* 当前高亮（绿色+下划线） */
      #sidebar a.active {
        color: #92c262 !important;
        text-decoration: underline !important;
      }


      /* 右侧主内容区 */
      #canvas {
        display: block;
        margin-left: 240px;       /* 给 sidebar 让出空间 */
        padding: 20px;
        box-sizing: border-box;
      }
      #canvas_cnv {
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- 左侧导航栏 -->
    <aside id="sidebar">
      <a href="index.html?category=all" class="active">All Posts</a>
      <a href="index.html?category=introduction_to_physical_computing">Introduction to Physical Computing</a>
      <a href="index.html?category=introduction_to_computational_media">Introduction to Computational Media</a>
      <a href="index.html?category=hypercinema">Hyercinema</a>
      <a href="index.html?category=visual_language">Visual Language</a>
    </aside>

    <!-- 右侧主内容 -->
    <div id="canvas"></div>

    <!-- 组件与模板脚本 -->
    <script src="../constructor_functions/BlogBox.js"></script>
    <script src="index.js"></script>
     <!-- 自动根据当前 ?category=xxx 高亮对应导航 -->
    <script>
      (async function () {
        const params = new URLSearchParams(location.search);
        const curCategory = params.get("category");  // 列表模式
        const curSlug     = params.get("slug");      // 详情模式优先
        const curUrl      = params.get("url");
        const curTitle    = params.get("title");

        // 取到所有 sidebar 链接与其 category 值
        const links = Array.from(document.querySelectorAll("#sidebar a")).map(a => {
          const url = new URL(a.href, location.origin);
          const cat = new URLSearchParams(url.search).get("category") || "all";
          return { a, cat };
        });

        // 工具：根据分类集合，高亮对应链接（允许多选高亮）
        function highlightCategories(catSet) {
          links.forEach(({ a, cat }) => {
            if (catSet.has(cat)) a.classList.add("active");
            else a.classList.remove("active");
          });
        }

        // 列表模式：只高亮当前 category（默认 all）
        if (curCategory) {
          highlightCategories(new Set([curCategory]));
          return;
        }

        // 详情模式：根据 slug/url/title 找到该篇，拿到它的 categories
        if (curSlug || curUrl || curTitle) {
          try {
            const resp = await fetch("blog_data.json");
            const raw = await resp.json();
            const list = Array.isArray(raw) ? raw : Object.values(raw);

            let post = null;
            if (curSlug)  post = list.find(p => p && p.slug  === curSlug);
            if (!post && curUrl)   post = list.find(p => p && p.url   === curUrl);
            if (!post && curTitle) post = list.find(p => p && p.title === curTitle);

            // 兜底：若没指定参数，尝试用路径尾部匹配 url
            if (!post) {
              const path = location.pathname.replace(/^.*\//, "");
              post = list.find(p => p && p.url && p.url.endsWith(path));
            }

            if (post && Array.isArray(post.categories) && post.categories.length) {
              // 同时高亮这篇文章的所有分类（不含all）
              const set = new Set(post.categories.filter(c => c !== "all"));
              highlightCategories(set);
            } else {
              // 找不到就默认高亮 all
              highlightCategories(new Set(["all"]));
            }
          } catch (e) {
            console.error("Highlight (detail) failed:", e);
            highlightCategories(new Set(["all"]));
          }
          return;
        }

        // 无参数：默认高亮 all
        highlightCategories(new Set(["all"]));
      })();
    </script>
  </body>
</html>
