<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>acrylic_painting</title>

    <link rel="stylesheet" type="text/css" href="../css_styles/style.css">

    <style>
        body {
            margin: 0;
            overflow-y: scroll;
        }

        /* 居中容器 */
        .page-container {
            width: 1500px;
            margin: 0 auto;
            padding-top: 20px;
            padding-bottom: 20px;
            box-sizing: border-box;
        }

        /* Masonry 采用绝对定位布局 */
        .masonry {
            position: relative;
        }

        .item {
            position: absolute;
        }

        .item img {
            width: 100%;
            height: auto;
            display: block;
        }

        
    </style>
</head>

<body>

    <div class="page-container">

        <main class="masonry" id="masonry">
            <div class="item"><img src="/images_videos/painting/acrylic_painting/4.jpg"></div>
            <div class="item"><img src="/images_videos/painting/acrylic_painting/3.jpg"></div>
            <div class="item"><img src="/images_videos/painting/acrylic_painting/1.jpg"></div>
            <div class="item"><img src="/images_videos/painting/acrylic_painting/2.jpg"></div>
        </main>

    </div>

    <script>
        const container = document.getElementById("masonry");
        const items = Array.from(container.children);

        const columnCount = 4;

        /** 图片之间的垂直间距 */
        const imageGap = 20;

        /** 栏之间负间距 */
        const columnGap = -40;

        /** 顶部偏移 */
        const columnOffset = [20, 0, 80, 40];

        function layoutMasonry() {
            const containerWidth = container.offsetWidth;

            // 每栏宽度（包含正常正向 horizontal 间距）
            const columnWidth = (containerWidth - imageGap * (columnCount - 1)) / columnCount;

            // ❗计算负间距后的“实际总宽度”
            const actualWidth = columnCount * columnWidth + (columnCount - 1) * columnGap;

            // ❗计算居中偏移量
            const offsetX = (containerWidth - actualWidth) / 2;

            // 初始化每列高度
            const colHeights = columnOffset.slice();

            items.forEach(item => {
                item.style.width = `${columnWidth}px`;

                // 最矮列
                let minCol = 0;
                for (let i = 1; i < columnCount; i++) {
                    if (colHeights[i] < colHeights[minCol]) {
                        minCol = i;
                    }
                }

                // ❗x = 居中偏移 + 原本位置
                const x = offsetX + minCol * (columnWidth + columnGap);
                const y = colHeights[minCol];

                item.style.left = `${x}px`;
                item.style.top = `${y}px`;

                // 更新列高度
                const height = item.getBoundingClientRect().height;
                colHeights[minCol] += height + imageGap;
            });

            // 调整容器高度
            container.style.height = `${Math.max(...colHeights)}px`;
        }

        window.onload = layoutMasonry;
        window.onresize = layoutMasonry;

    </script>

</body>

</html>
