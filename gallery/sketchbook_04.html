    <script>
        const container = document.getElementById("masonry");
        const items = Array.from(container.children);

        const columnCount = 4;

        /** 图片之间的垂直间距 */
        const imageGap = 20;

        /** 栏之间负间距 */
        const columnGap = -40;

        /** 顶部偏移 */
        const columnOffset = [20, 0, 80, 40];

        function layoutMasonry() {
            const containerWidth = container.offsetWidth;

            // 每栏宽度（包含正常正向 horizontal 间距）
            const columnWidth = (containerWidth - imageGap * (columnCount - 1)) / columnCount;

            // 计算负间距后的“实际总宽度”
            const actualWidth = columnCount * columnWidth + (columnCount - 1) * columnGap;

            // 计算居中偏移量
            const offsetX = (containerWidth - actualWidth) / 2;

            // 初始化每列高度
            const colHeights = columnOffset.slice();

            items.forEach(item => {
                item.style.width = `${columnWidth}px`;

                // 最矮列
                let minCol = 0;
                for (let i = 1; i < columnCount; i++) {
                    if (colHeights[i] < colHeights[minCol]) {
                        minCol = i;
                    }
                }

                // x = 居中偏移 + 原本位置
                const x = offsetX + minCol * (columnWidth + columnGap);
                const y = colHeights[minCol];

                item.style.left = `${x}px`;
                item.style.top = `${y}px`;

                // 更新列高度
                const height = item.getBoundingClientRect().height;
                colHeights[minCol] += height + imageGap;
            });

            // 调整容器高度
            container.style.height = `${Math.max(...colHeights)}px`;
        }

        window.onload = layoutMasonry;
        window.onresize = layoutMasonry;

    </script>
