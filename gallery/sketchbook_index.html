<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sketchbook_index</title>
    <link rel="stylesheet" type="text/css" href="../css_styles/style.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #ffffff;
            overflow: hidden;
        }

        .page {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .gallery-wrap {
            overflow-x: auto;
            overflow-y: hidden;
            padding: 48px 80px 48px;
            scrollbar-width: none;
        }

        .gallery-wrap::-webkit-scrollbar {
            display: none;
        }

        .gallery-track {
            display: flex;
            align-items: center;
            gap: 80px;
            width: max-content;
        }

        .book,
        .book:hover {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            flex-shrink: 0;
            text-decoration: none;
            color: inherit;
        }

        .book-year {
            opacity: 0;
            transform: translateY(4px);
            transition: opacity 0.3s cubic-bezier(0.1, 0.9, 0.3, 1), transform 0.3s cubic-bezier(0.1, 0.9, 0.3, 1);
            margin-bottom: 12px;
            color: rgb(214, 214, 214);
            font-size: 1.2em;
            font-weight: bold;
            line-height: 1.2;
        }

        .book-img {
            position: relative;
            background: #e8e6e0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transform: translateY(0);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.3, 1);
        }

        .book:hover .book-year {
            opacity: 1;
            transform: translateY(0);
            color: rgb(214, 214, 214);
            text-decoration: none;
        }

        .book:hover .book-img {
            transform: translateY(16px);
        }

        .book-img img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .book-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
        }
    </style>
</head>
